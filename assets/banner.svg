<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">voice-alerts</title>
  <desc id="desc">A friendly voice that tells you when your coding agent needs you, and what it needs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b33"/>
      <stop offset="1" stop-color="#16367a"/>
    </linearGradient>
    <style>
      .wave { fill: none; stroke: #7cc4ff; stroke-width: 9; stroke-linecap: round; }
      .bar { fill: #7cc4ff; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        .w1 { animation: pulse 1.8s ease-in-out infinite; }
        .w2 { animation: pulse 1.8s ease-in-out .3s infinite; }
        .bar { animation: talk 1.2s ease-in-out infinite; }
        .b2 { animation-delay: .15s; } .b3 { animation-delay: .3s; } .b4 { animation-delay: .45s; }
        .b5 { animation-delay: .6s; } .b6 { animation-delay: .75s; } .b7 { animation-delay: .9s; }
      }
      @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @keyframes talk { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    </style>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>

  <!-- speaker -->
  <g transform="translate(96 88)">
    <circle cx="72" cy="72" r="72" fill="#ffffff" fill-opacity=".08"/>
    <path d="M42 58h18l26-22v72L60 86H42z" fill="#ffffff"/>
    <path class="wave w1" d="M98 52a28 28 0 0 1 0 40"/>
    <path class="wave w2" d="M112 36a50 50 0 0 1 0 72"/>
  </g>

  <!-- name and tagline -->
  <text x="300" y="158" fill="#ffffff" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1">voice-alerts</text>
  <text x="302" y="212" fill="#c7d6ee" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="27">A friendly voice that tells you when your coding agent needs you.</text>

  <!-- a voice, talking -->
  <g transform="translate(1080 124)">
    <rect class="bar b1" x="0" y="16" width="12" height="40" rx="6"/>
    <rect class="bar b2" x="22" y="0" width="12" height="72" rx="6"/>
    <rect class="bar b3" x="44" y="10" width="12" height="52" rx="6"/>
    <rect class="bar b4" x="66" y="-8" width="12" height="88" rx="6"/>
    <rect class="bar b5" x="88" y="12" width="12" height="48" rx="6"/>
    <rect class="bar b6" x="110" y="2" width="12" height="68" rx="6"/>
    <rect class="bar b7" x="132" y="20" width="12" height="32" rx="6"/>
  </g>
</svg>
